<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <h1 class="login__title">Iniciar sesión</h1>
    <p class="login__subtitle">Ingresa para ver el catálogo de productos</p>

    @if (error) {
    <div class="login__error" role="alert">{{ error }}</div>
    }

    <label class="login__field">
      <span>Usuario</span>
      <input class="input" type="text" formControlName="username" autocomplete="username" placeholder="emilys" />
      @if (form.controls.username.touched && form.controls.username.errors; as errors) {
      <small class="login__invalid">
        @if (errors['required']) {
        El usuario es obligatorio
        } @else if (errors['minlength']) {
        Mínimo {{ errors['minlength'].requiredLength }} caracteres
        }
      </small>
      }
    </label>

    <label class="login__field">
      <span>Contraseña</span>
      <input class="input" type="password" formControlName="password" autocomplete="current-password"
        placeholder="••••••••" />
      @if (form.controls.password.touched && form.controls.password.errors; as errors) {
      <small class="login__invalid">
        @if (errors['required']) {
        La contraseña es obligatoria
        } @else if (errors['minlength']) {
        Mínimo {{ errors['minlength'].requiredLength }} caracteres
        }
      </small>
      }
    </label>

    <button type="submit" class="btn login__submit">Entrar</button>

    <p class="login__hint">
      Prueba con <code>{{ hint.username }}</code> / <code>{{ hint.password }}</code>
    </p>
  </form>
</main>
