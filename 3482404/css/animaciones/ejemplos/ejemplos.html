<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Animaciones CSS - ADSO</title>

</head>

<body>
  <h1>Animaciones CSS</h1>

  <div class="grid">
    <div class="demo">
      <h2>1. Máquina de escribir</h2>
      <div class="stage">
        <p class="typewriter">Hola, aprendices!</p>
      </div>
    </div>

    <div class="demo">
      <h2>2. Spinner</h2>
      <div class="stage">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="demo">
      <h2>3. Puntos de carga</h2>
      <div class="stage">
        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="demo">
      <h2>4. Latido</h2>
      <div class="stage">
        <div class="heart">❤️</div>
      </div>
    </div>

    <div class="demo">
      <h2>5. Sacudida de error</h2>
      <div class="stage"><input class="shake-input" value="clave incorrecta"></div>
    </div>

    <div class="demo">
      <h2>6. Texto degradado</h2>
      <div class="stage">
        <p class="gradient-text">ADSO</p>
      </div>
    </div>

    <div class="demo">
      <h2>7. Tarjeta 3D (hover / tap)</h2>
      <div class="stage">
        <div class="flip" tabindex="0">
          <div class="flip-inner">
            <div class="flip-face flip-front">Pregunta</div>
            <div class="flip-face flip-back">Respuesta</div>
          </div>
        </div>
      </div>
    </div>

    <div class="demo">
      <h2>8. Skeleton loading</h2>
      <div class="stage">
        <div class="skeleton">
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </div>

    <div class="demo">
      <h2>9. Ola de letras</h2>
      <div class="stage">
        <p class="wave">
          <span style="--i:0">S</span>
          <span style="--i:1">E</span>
          <span style="--i:2">N</span>
          <span style="--i:3">A</span>
        </p>
      </div>
    </div>

    <div class="demo">
      <h2>10. Neón</h2>
      <div class="stage">
        <p class="neon">CCyT</p>
      </div>
    </div>
  </div>
</body>

</html>
