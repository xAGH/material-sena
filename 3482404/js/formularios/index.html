<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <form id="form-registro" novalidate action="">
        <div class="campo">
            <label for="profesion">Profesion</label>
            <input type="text" id="profesion" name="profesion">
            <small class="error" id="error-profesion"></small>
        </div>

        <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre">
            <small class="error" id="error-nombre"></small>
        </div>

        <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo">
            <small class="error" id="error-correo"></small>
        </div>

        <div class="campo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad">
            <small class="error" id="error-edad"></small>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password">
            <small class="error" id="error-password"></small>
        </div>

        <div class="campo">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar">
            <small class="error" id="error-confirmar"></small>
        </div>

        <div class="campo">
            <label for="programa">Programa</label>
            <select id="programa" name="programa">
                <option value="">Seleccione...</option>
                <option value="software">Desarrollo de Software</option>
                <option value="multimedia">Multimedia</option>
                <option value="redes">Redes</option>
            </select>
            <small class="error" id="error-programa"></small>
        </div>

        <div class="campo">
            <span>Jornada</span>
            <label><input type="radio" name="jornada" value="manana"> Mañana</label>
            <label><input type="radio" name="jornada" value="tarde"> Tarde</label>
            <label><input type="radio" name="jornada" value="noche"> Noche</label>
            <small class="error" id="error-jornada"></small>
        </div>

        <div class="campo">
            <label>
                <input type="checkbox" id="terminos" name="terminos">
                Acepto los términos y condiciones
            </label>
            <small class="error" id="error-terminos"></small>
        </div>

        <button type="submit">Registrarse</button>
        <p id="mensaje-exito"></p>
    </form>
</body>

</html>
