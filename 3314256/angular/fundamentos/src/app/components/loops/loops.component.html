<label for="filter">Filtrar</label>
<input type="text" name="filter" [(ngModel)]="search">

@for(person of filtered(); track person.id) {
<article>
  <h2>{{ person.name }}</h2>
  <p>Email: {{ person.email }}</p>
  <p>Edad: {{ person.age }}</p>
</article>
} @empty {
<h1>NO SE ENCONTRÓ PERSONAS CON ESTE NOMBRE</h1>
}
