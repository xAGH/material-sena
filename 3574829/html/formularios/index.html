<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form>
        <label for="name">Nombre</label>
        <input required minlength="3" maxlength="10" id="name" type="text" placeholder="Alejo Giraldo" value="Alejo">
        <br>
        <label for="age">Edad</label>
        <input required min="1" max="100" id="age" type="number" placeholder="30">
        <br>
        <label for="email">Email</label>
        <input id="email" type="email">
        <br>
        <label for="password">Contraseña</label>
        <input id="password" type="password">
        <br>
        <label for="color">Color favorito</label>
        <input id="color" type="color">
        <br>

        <div>
            <label>Género</label>
            <br>
            <label for="male">Hombre</label>
            <input name="genero" id="male" type="radio">
            <label for="female">Mujer</label>
            <input name="genero" id="female" type="radio">
        </div>

        <div>
            <label for="hobbies">Hobbies</label>
            <br>
            <label for="games">Videojuegos</label>
            <input id="games" type="checkbox">
            <label for="music">Música</label>
            <input id="music" type="checkbox">
            <label for="program">Programar</label>
            <input id="program" type="checkbox">
        </div>

        <label for="country">País</label>
        <select id="country">
            <option value="colombia">Colombia</option>
            <option value="peru">Perú</option>
            <option value="españa">España</option>
        </select>
        <br>

        <label for="description">Descripción</label>
        <textarea id="description"></textarea>

        <br>

        <button type="submit">Enviar form</button>
        <button type="reset">Resetear</button>

    </form>

</body>

</html>
