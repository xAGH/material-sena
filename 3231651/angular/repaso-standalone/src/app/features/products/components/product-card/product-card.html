<article class="card">
  <img [src]="product().thumbnail" [alt]="product().title" />
  <h3>{{ product().title }}</h3>
  <p class="category">{{ product().category }}</p>
  <p class="price">{{ product().price | currency }}</p>
  <a [routerLink]="['/products', product().id]">Ver detalle</a>
</article>
